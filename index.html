<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      ROSA ships no external font requests and no inline hardcoded palette.
      The theme is applied by src/main.tsx from localStorage before first paint
      so there is no flash of the wrong theme.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="ROSA — chat with and compare up to four AI models side by side, using your own API keys."
    />
    <title>ROSA — AI chat and model comparison</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
