[package]
name = "acme-ace-studio"
version = "0.1.0"
description = "Acme AI - Ace Studio 2.0"
authors = ["Acme AI"]
edition = "2021"

[lib]
name = "acme_ace_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
